# Reusable CI for @wcmj/config-* consumers.
# Call it from your own .github/workflows/ci.yml:
#   jobs:
#     ci:
#       uses: callumhoward/ts-shared-config/.github/workflows/ci-reusable.yml@v1
#       with: { run-build: true, run-e2e: true }
name: CI (reusable)

on:
  workflow_call:
    inputs:
      node-version-file:
        type: string
        default: .nvmrc
      run-css:
        description: Run `pnpm lint:css` (keep for stylelint/Tailwind consumers).
        type: boolean
        default: true
      run-build:
        description: Run `pnpm build` (app tiers — react/tanstack).
        type: boolean
        default: false
      run-e2e:
        description: Install Chromium and run `pnpm test:e2e` (config-playwright).
        type: boolean
        default: false
      check-pnpm-policy:
        description: Validate pnpm-workspace.yaml against the config-base supply-chain schema.
        type: boolean
        default: true
      diff-coverage-threshold:
        type: number
        default: 80

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - uses: pnpm/action-setup@v6

      # No pnpm store cache: a cold install costs about what restoring and
      # saving the store does.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm-workspace policy
        if: ${{ inputs.check-pnpm-policy }}
        run: >-
          pipx run check-jsonschema
          --schemafile node_modules/@wcmj/config-base/schema/pnpm-workspace.json
          pnpm-workspace.yaml

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint:ci

      - name: Lint CSS
        if: ${{ inputs.run-css }}
        run: pnpm lint:css

      - name: Format check
        run: pnpm format:check

      - name: Fallow
        run: pnpm fallow

      - name: Test
        run: pnpm test:cov

      - name: Diff coverage
        run: |
          pipx run diff-cover coverage/lcov.info \
            --compare-branch origin/${{ github.base_ref || 'main' }} \
            --fail-under ${{ inputs.diff-coverage-threshold }}

      - name: Build
        if: ${{ inputs.run-build }}
        run: pnpm build

      - name: Resolve Playwright version
        # The browser cache key must match the exact Playwright build it
        # belongs to.
        if: ${{ inputs.run-e2e }}
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        if: ${{ inputs.run-e2e }}
        id: playwright-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          # Deliberately no restore-keys: another Playwright version's browser
          # build can't be driven, so a partial hit is worse than a miss.
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # No --with-deps: those libraries ship with ubuntu-latest, and apt can
      # wedge on dpkg's lock.
      - name: Install Playwright Chromium
        if: ${{ inputs.run-e2e && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install chromium

      - name: E2E
        if: ${{ inputs.run-e2e }}
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.run-e2e && failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Main-only and last, so the save follows a green job; a PR's own entries
      # are readable only by that PR.
      - name: Save Playwright browsers
        if: ${{ inputs.run-e2e && github.ref_name == github.event.repository.default_branch && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
