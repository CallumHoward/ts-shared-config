# Reusable CI for @wcmj/config-* consumers.
# Call it from your own .github/workflows/ci.yml:
#   jobs:
#     ci:
#       uses: callumhoward/ts-shared-config/.github/workflows/ci-reusable.yml@<commit of a release tag> # v1
#       with: { run-build: true, run-e2e: true }
name: CI (reusable)

on:
  workflow_call:
    inputs:
      node-version-file:
        type: string
        default: .nvmrc
      run-css:
        description: Run `pnpm lint:css` (keep for stylelint/Tailwind consumers).
        type: boolean
        default: true
      run-build:
        description: Run `pnpm build` (app tiers — react/tanstack).
        type: boolean
        default: false
      run-e2e:
        description: Install Chromium and run `pnpm test:e2e` (config-playwright).
        type: boolean
        default: false
      check-peers:
        description: Run `pnpm peers check` so an unmet peer range fails CI (pnpm 11+).
        type: boolean
        default: false
      check-dedupe:
        description: Run `pnpm dedupe --check` so avoidable duplicate resolutions fail CI.
        type: boolean
        default: false
      check-schemas:
        description: Run `sill check` so config files that reference a schema, or match SchemaStore, are validated.
        type: boolean
        default: false
      check-pnpm-policy:
        description: Validate pnpm-workspace.yaml against the config-base supply-chain schema (needs @wcmj/sill).
        type: boolean
        default: true
      diff-coverage-threshold:
        type: number
        default: 80

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No pnpm store cache: a cold install costs about what restoring and
      # saving the store does.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Peer dependencies
        if: ${{ inputs.check-peers }}
        run: pnpm peers check

      - name: Dedupe
        if: ${{ inputs.check-dedupe }}
        run: pnpm dedupe --check

      - name: pnpm-workspace policy
        if: ${{ inputs.check-pnpm-policy }}
        run: >-
          pnpm exec sill check
          --config node_modules/@wcmj/config-base/schema/sill-policy.jsonc
          pnpm-workspace.yaml

      - name: Config schemas
        if: ${{ inputs.check-schemas }}
        run: pnpm exec sill check

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint:ci

      - name: Lint CSS
        if: ${{ inputs.run-css }}
        run: pnpm lint:css

      - name: Format check
        run: pnpm format:check

      - name: Fallow
        run: pnpm fallow

      - name: Test
        run: pnpm test:cov

      - name: Diff coverage
        run: |
          pipx run diff-cover==10.6.0 coverage/lcov.info \
            --compare-branch origin/${{ github.base_ref || 'main' }} \
            --fail-under ${{ inputs.diff-coverage-threshold }}

      - name: Build
        if: ${{ inputs.run-build }}
        run: pnpm build

      - name: Resolve Playwright version
        # The browser cache key must match the exact Playwright build it
        # belongs to.
        if: ${{ inputs.run-e2e }}
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        if: ${{ inputs.run-e2e }}
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Deliberately no restore-keys: another Playwright version's browser
          # build can't be driven, so a partial hit is worse than a miss.
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # No --with-deps: those libraries ship with ubuntu-latest, and apt can
      # wedge on dpkg's lock.
      - name: Install Playwright Chromium
        if: ${{ inputs.run-e2e && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install chromium

      - name: E2E
        if: ${{ inputs.run-e2e }}
        run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.run-e2e && failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Main-only and last, so the save follows a green job; a PR's own entries
      # are readable only by that PR.
      - name: Save Playwright browsers
        if: ${{ inputs.run-e2e && github.ref_name == github.event.repository.default_branch && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
