# Opens a "Version packages" PR from pending changesets; merging it publishes
# the config-* packages to npm with provenance (the starter's pnpm
# `trustPolicy: no-downgrade` needs attested releases).
# Requires an NPM_TOKEN repository secret with publish rights to @wcmj.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # The tag the CI template and README point consumers at; it follows the
      # latest release so workflow fixes reach them without re-copying.
      - name: Move the v1 tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          git tag -f v1
          git push -f origin v1
