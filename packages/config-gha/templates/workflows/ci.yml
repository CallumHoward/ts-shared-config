# CI caller from @wcmj/config-gha. Copy to .github/workflows/ci.yml.
#
# It calls the shared reusable workflow, so updates flow by bumping the @ref —
# no need to re-copy. It pins the @v1 release tag; use @main only to try
# unreleased changes. Toggle the tier inputs for the add-ons you use.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: callumhoward/ts-shared-config/.github/workflows/ci-reusable.yml@v1
    with:
      run-css: true # config-base ships stylelint
      run-build: false # set true for app tiers (config-react / config-tanstack)
      run-e2e: false # set true with config-playwright
      check-peers: false # set true on pnpm 11+ to fail on unmet peers
      check-dedupe: false # set true to fail on avoidable duplicate resolutions
