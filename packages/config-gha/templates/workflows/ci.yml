# CI caller from @wcmj/config-gha. Copy to .github/workflows/ci.yml.
#
# It calls the shared reusable workflow, so you don't re-copy CI logic. Pin it
# to the commit a release tag points at (the moving v1 tag is mutable); keep the
# `# v1` comment so Dependabot or Renovate can bump it. Find the commit with:
#   git ls-remote https://github.com/callumhoward/ts-shared-config refs/tags/v1
# Toggle the tier inputs for the add-ons you use.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: callumhoward/ts-shared-config/.github/workflows/ci-reusable.yml@dccb6f3467eeb2ca80fc6327c66fb7c920a36836 # v1
    with:
      run-css: true # config-base ships stylelint
      run-build: false # set true for app tiers (config-react / config-tanstack)
      run-e2e: false # set true with config-playwright
      check-peers: false # set true on pnpm 11+ to fail on unmet peers
      check-dedupe: false # set true to fail on avoidable duplicate resolutions
