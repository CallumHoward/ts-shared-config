# @callumhoward/config-base — base git hooks.
# Consumers extend this from their own lefthook.yml:
#   extends:
#     - node_modules/@callumhoward/config-base/lefthook.yml
pre-commit:
  parallel: true
  jobs:
    - run: pnpm exec oxlint --quiet --fix '{staged_files}'
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      stage_fixed: true
    - run: pnpm exec stylelint --fix '{staged_files}'
      glob: "*.css"
      stage_fixed: true
    - run: pnpm exec oxfmt --no-error-on-unmatched-pattern '{staged_files}'
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css,md,yaml,yml,html}"
      stage_fixed: true
    - run: pnpm check
      glob: "*.{ts,tsx}"
    - run: pnpm fallow
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}"
